<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campus Trace 校园迹忆</title>

  <!-- 字体：使用系统字体，避免依赖境外字体服务 -->
  <!-- Bootstrap -->
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css"/>

  <!-- 自定义样式 -->
  <link rel="stylesheet" href="style.css">

  <!-- 网站图标 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' transform='scaleX(-1)'>🐕</text></svg>">
</head> 

<body>

  <!-- 登录 / 注册 -->
  <div id="authOverlay" class="auth-overlay" style="display: none;">
    <div class="auth-card">
      <div class="auth-brand">
        <i class="fas fa-paw me-2"></i>
        <strong>Campus Trace</strong>
        <small>校园迹忆</small>
      </div>
      <p class="auth-subtitle">登录后，你的每一步都会保存在云端</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">登录</button>
        <button type="button" class="auth-tab" data-mode="register">注册</button>
      </div>

      <form id="authForm" class="auth-form">
        <div class="auth-field">
          <label for="authUsername"><i class="fas fa-user me-1"></i>用户名</label>
          <input type="text" id="authUsername" name="username" autocomplete="username" minlength="2" maxlength="20" required>
        </div>
        <div class="auth-field">
          <label for="authPassword"><i class="fas fa-lock me-1"></i>密码</label>
          <input type="password" id="authPassword" name="password" autocomplete="current-password" minlength="6" maxlength="50" required>
        </div>
        <p id="authError" class="auth-error"></p>
        <button type="submit" id="authSubmit" class="btn btn-success w-100">
          <i class="fas fa-sign-in-alt me-1"></i>登录
        </button>
      </form>

      <p class="auth-hint">用户名 2-20 个字符，密码至少 6 位</p>
    </div>
  </div>

  <!-- 顶部导航 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-transparent shadow-sm position-fixed w-100" style="z-index: 100;">
    <div class="container">
      <a class="navbar-brand text-success" href="#">
        <i class="fas fa-paw me-2"></i>
        <strong>Campus Trace</strong>
        <small class="d-block d-md-inline ms-md-2 text-light">校园迹忆</small>
      </a>
      <div class="d-flex align-items-center">
        <!-- 骨头和奖杯数量显示 -->
        <div class="text-light me-3 d-flex align-items-center">
          <i class="fas fa-bone me-1"></i>
          <span id="boneCount" class="font-weight-bold">0</span>
        </div>
        <div class="text-light me-3 d-flex align-items-center">
          <i class="fas fa-trophy me-1"></i>
          <span id="trophyCount" class="font-weight-bold">0</span>
        </div>
        <div class="nav-user text-light me-3 d-flex align-items-center">
          <i class="fas fa-user-circle me-1"></i>
          <span id="currentUser">未登录</span>
          <button class="btn btn-link btn-sm text-white-50 ms-2 p-0" onclick="showChangePassword()" title="修改密码">
            <i class="fas fa-key"></i>
          </button>
        </div>
        <button class="btn btn-outline-info btn-sm me-2" onclick="showPage('search')">
          <i class="fas fa-search"></i> 搜索
        </button>
        <button class="btn btn-outline-warning btn-sm me-2" onclick="showPage('kb')">
          <i class="fas fa-book-open"></i> 知识库
        </button>
        <button id="navAdminUsers" class="btn btn-outline-primary btn-sm me-2 d-none" onclick="showPage('users')">
          <i class="fas fa-users-cog"></i> 用户管理
        </button>
        <button class="btn btn-outline-success btn-sm me-2" onclick="showPage('checkin')">
          <i class="fas fa-calendar-check"></i> 打卡统计
        </button>
        <button class="btn btn-outline-light btn-sm me-2" onclick="showPage('add')">
          <i class="fas fa-plus"></i> 新记录
        </button>
        <button class="btn btn-outline-secondary btn-sm" onclick="showPage('timeline')">
          <i class="fas fa-home"></i> 回森林
        </button>
        <button class="btn btn-outline-danger btn-sm ms-2" onclick="logout()" title="退出登录">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <div class="container mt-5 pt-5">
    <div id="app">
      <div class="text-center py-5">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">加载中...</span>
        </div>
        <p class="mt-3 text-muted">进入成长森林中...</p>
      </div>
    </div>
  </div>

  <!-- 森林场景 -->
  <div id="forestScene" class="forest-scene-active">
    <div class="forest-viewport" id="forestViewport">
      <div class="forest-path-container" id="forestPathContainer">
        <!-- 真实森林背景图 -->
        <div class="forest-background"></div>

        <!-- 时间之路（路径） -->
        <div class="time-road"></div>

        <!-- 小狗 -->
        <div class="running-dog" id="runningDog">
          <div class="dog-face">🐕</div>
        </div>

        <!-- 月份标记 -->
        <div class="month-markers" id="monthMarkers"></div>

        <!-- 年份旗帜 -->
        <div class="year-flags" id="yearFlags"></div>

        <!-- 记录花朵（只有有记录的日子才有） -->
        <div class="record-flowers" id="recordFlowers"></div>
      </div>
    </div>

    <!-- 横向滚动进度轨道 -->
    <div class="forest-progress" id="forestProgress">
      <div class="forest-progress-track" id="forestProgressTrack">
        <div class="forest-progress-thumb" id="forestProgressThumb"></div>
      </div>
    </div>

    <!-- 时间轴大树（点击花朵后显示） -->
    <div class="timeline-tree" id="timelineTree">
      <div class="tree-trunk"></div>
      <div class="text-center p-5">
        <div class="display-1 mb-3">🌳</div>
        <h4 class="text-white">点击一朵花查看那天的故事</h4>
        <p class="text-white-50">小金毛会告诉你它那天经历了什么</p>
      </div>
    </div>
  </div>

  <!-- 添加记录弹窗背景 -->
  <div id="addRecordModalOverlay" class="modal-overlay" style="display: none;"></div>

  <!-- 添加记录按钮 -->
  <button class="add-record-btn" onclick="showPage('add')">
    <i class="fas fa-feather-alt"></i>
  </button>

  <!-- 删除确认对话框 -->
  <div id="deleteConfirmOverlay" class="delete-confirm-overlay" style="display: none;">
    <div class="delete-confirm-dialog">
      <h5 class="text-white">
        <i class="fas fa-exclamation-triangle text-warning me-2"></i>
        确认删除记录？
      </h5>
      <div id="deleteRecordPreview" class="delete-preview mt-3 mb-4"></div>
      <div class="dialog-actions">
        <button class="btn btn-outline-light btn-sm" onclick="cancelDelete()">
          <i class="fas fa-times me-1"></i>取消
        </button>
        <button class="btn btn-danger btn-sm ms-2" onclick="confirmDelete()">
          <i class="fas fa-trash-alt me-1"></i>确认删除
        </button>
      </div>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div id="changePwdOverlay" class="modal-overlay" style="display: none;">
    <div class="modal-dialog-box" style="max-width: 420px;">
      <h5 class="text-white mb-3">
        <i class="fas fa-key text-info me-2"></i>修改密码
      </h5>
      <form id="changePwdForm" onsubmit="submitChangePassword(event)">
        <div class="mb-3">
          <label class="form-label text-white-50 small">旧密码</label>
          <input type="password" id="oldPwd" class="form-control bg-dark text-white border-secondary" placeholder="请输入当前密码" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-white-50 small">新密码（6-50 位）</label>
          <input type="password" id="newPwd" class="form-control bg-dark text-white border-secondary" placeholder="请输入新密码" minlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-white-50 small">确认新密码</label>
          <input type="password" id="confirmPwd" class="form-control bg-dark text-white border-secondary" placeholder="再次输入新密码" minlength="6" required>
        </div>
        <div id="changePwdError" class="text-danger small mb-3" style="display:none;"></div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-outline-light btn-sm" onclick="closeChangePassword()">
            <i class="fas fa-times me-1"></i>取消
          </button>
          <button type="submit" id="changePwdSubmit" class="btn btn-primary btn-sm ms-2">
            <i class="fas fa-check me-1"></i>确认修改
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="mt-5 py-3 text-center text-white-50">
    <div class="container">
      <small>© 2025 Campus Trace | 回看来时路，每一步都算数</small>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
